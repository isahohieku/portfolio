<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <title>Isah Ohieku | Software Engineer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Isah Ohieku is a software engineer building fintech, payments, calling and edtech platforms: Talk360, ApplyPay, Hobeei and SwipeNG.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preload" href="assets/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Canonical host. This is the ONE place the domain is declared for the
       document head; robots.txt and sitemap.xml carry it too. Crawlers reject
       relative og:image/twitter:image, which is why these are absolute. -->
  <link rel="canonical" href="https://isahohieku.com/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://isahohieku.com/">
  <meta property="og:site_name" content="Isah Ohieku">
  <meta property="og:title" content="Isah Ohieku | Software Engineer">
  <meta property="og:description" content="Software engineer building fintech, payments, calling and edtech platforms: Talk360, ApplyPay, Hobeei and SwipeNG.">
  <meta property="og:image" content="https://isahohieku.com/assets/img/og.png">
  <meta property="og:image:alt" content="Isah Ohieku, software engineer">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Isah Ohieku | Software Engineer">
  <meta name="twitter:description" content="Software engineer building fintech, payments, calling and edtech platforms: Talk360, ApplyPay, Hobeei and SwipeNG.">
  <meta name="twitter:image" content="https://isahohieku.com/assets/img/og.png">

  <!--
    Person entity. Every field here already appears on the rendered site — the
    role, the employer, the social profiles in the footer — so the markup makes
    a crawler's job easier without asserting anything the page does not.
  -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Isah Ohieku",
      "url": "https://isahohieku.com/",
      "jobTitle": "Software Engineer",
      "email": "mailto:isahohieku@gmail.com",
      "worksFor": { "@type": "Organization", "name": "Talk360" },
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "Ahmadu Bello University"
      },
      "sameAs": [
        "https://www.linkedin.com/in/isah-ohieku",
        "https://www.github.com/isahohieku",
        "https://www.dribbble.com/isahohieku",
        "https://www.behance.net/isahohiekufa98",
        "https://x.com/isahohieku"
      ]
    }
  </script>

  <!-- Resolve the theme before first paint so the page never flashes the
       wrong mode. ThemeService adopts whatever this leaves on the element. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('io-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { /* keep the dark default */ }
    })();
  </script>

  <!-- The hero portrait is the LCP element on /, but it lives in the lazy
       landing chunk, so the browser would not discover it until that chunk
       ran. Start the fetch from the document instead. Only on /, so other
       routes do not pay for an image they never show. Keep the srcsets and
       sizes in step with the two <picture>s in landing.component.html. -->
  <script>
    (function () {
      if (location.pathname !== '/') return;
      var hero = [
        ['(min-width: 1024px)', 'assets/img/hero/isah-800.avif 800w, assets/img/hero/isah-960.avif 960w', '44vw'],
        ['(max-width: 1023.98px)', 'assets/img/hero/isah-480.avif 480w, assets/img/hero/isah-800.avif 800w, assets/img/hero/isah-960.avif 960w', 'calc(100vw - 2.5rem)']
      ];
      hero.forEach(function (h) {
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.type = 'image/avif';
        link.media = h[0];
        link.setAttribute('imagesrcset', h[1]);
        link.setAttribute('imagesizes', h[2]);
        link.setAttribute('fetchpriority', 'high');
        document.head.appendChild(link);
      });
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>

</html>
