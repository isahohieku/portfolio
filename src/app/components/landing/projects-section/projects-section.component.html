<div class="md:max-w-75rem mx-auto mb-4 flex-wrap sm:max-w-full px-5">
    <h2 class="mb-12 font-medium text-6xl sm:text-4xl">Sneak Peek</h2>
</div>

<div class="md:max-w-75rem mx-auto mt-12 sm:max-w-full px-5">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-x-6 md:gap-y-0">
        @for (project of projects; track project.id) {
        <div>
            <app-project-card [project]="project"></app-project-card>
        </div>
        }
    </div>
</div>

<div class="md:max-w-75rem flex justify-end mx-auto mt-12 flex-wrap sm:max-w-full sm:px-5">
    <a [routerLink]="['/works']"
       class="cursor-pointer text-center text-base font-lato py-3 border border-primary-dark text-primary-dark w-68 hover:bg-primary-yellow hover:border-primary-yellow transition-colors duration-300 sm:w-48 sm:text-sm">
        See all {{ totalCount }} projects
    </a>
</div>
