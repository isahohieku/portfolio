<!--
  The card root is an anchor, not a div. Previously the only interactive element
  was a link inside the hover-revealed caption, which is unreachable on touch —
  the whole card was a dead end on a phone.

  Nothing load-bearing is hover-gated any more either: the title, the summary
  and the case-study marker are all visible at rest, because roughly half the
  audience arrives on a phone and will never produce a hover.
-->
<a
  [routerLink]="['/works', project.slug]"
  class="project-wrapper group flex h-full flex-col overflow-hidden rounded-x-large border border-subtle bg-surface-minimal shadow-raised transition-all duration-base ease-io hover:-translate-y-1 hover:shadow-raised-variant">
  <!-- Logo plate: the project's own colour, used as a field rather than a whole-card wash -->
  <div
    class="relative flex h-44 items-center justify-center overflow-hidden px-10 sm:h-52"
    [ngStyle]="{ backgroundColor: project.bgColor }">
    <div class="absolute inset-0 bg-gradient-to-tr from-black/20 to-transparent"></div>
    <app-project-logo
      [src]="project.logo"
      [title]="project.title"
      imgClass="relative z-10 h-12 w-auto object-contain transition-transform duration-slow ease-io-out group-hover:scale-105 sm:h-14"
      wordmarkClass="relative z-10 text-center text-xl font-bold tracking-tight text-white sm:text-2xl" />
  </div>

  <div class="flex flex-1 flex-col gap-2 p-6">
    <h3 class="io-heading-sm text-heading">{{ project.title }}</h3>

    @if (project.description) {
      <p class="io-body-sm text-muted">{{ project.description }}</p>
    }

    <span
      class="mt-auto inline-flex items-center gap-2 pt-4 io-label text-brand-text transition-transform duration-base ease-io group-hover:translate-x-1">
      {{ hasCaseStudy ? 'Read the case study' : 'View project' }}
      <i class="pi pi-arrow-right text-xs" aria-hidden="true"></i>
    </span>
  </div>
</a>
