<header class="flex items-center mt-4 md:mt-12 mx-auto md:px-12 px-5 relative">
    <a class="font-playfair uppercase text-[2.5rem] drop-shadow-[0_5px_3px_rgba(0,0,0,0.35)]" href="/">io</a>

    <!-- Persistent Desktop Nav -->
    <nav class="hidden md:flex ml-auto space-x-8 lg:space-x-12 items-center mr-8 lg:mr-16">
        <a routerLink="/about" 
           class="font-lato text-sm lg:text-base uppercase tracking-[0.2em] text-primary-dark hover:text-primary-yellow transition-all duration-300 relative group">
           About Me
           <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary-yellow transition-all duration-300 group-hover:w-full"></span>
        </a>
        <a routerLink="/works" 
           class="font-lato text-sm lg:text-base uppercase tracking-[0.2em] text-primary-dark hover:text-primary-yellow transition-all duration-300 relative group">
           My Works
           <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary-yellow transition-all duration-300 group-hover:w-full"></span>
        </a>
    </nav>

    <!-- Hamburger button - hidden on desktop -->
    <button class="ml-auto md:hidden p-0 h-6 w-8 z-50 hambuger-btn transform-gpu"
            (click)="toggleHamburger()">
        <span class="hamburger-menu" [ngClass]="{'hamburger-close': hamburgerState}"></span>
    </button>
</header>

<!-- Side menu overlay -->
<div class="sidemenu-wrapper fixed inset-0 bg-black transition-all duration-300 ease-in-out"
     [ngClass]="{
       'bg-opacity-50 visible z-40 pointer-events-auto': hamburgerState,
       'bg-opacity-0 invisible -z-10 pointer-events-none': !hamburgerState
     }"
     (click)="toggleHamburger()"
     (keydown.escape)="toggleHamburger()"
     tabindex="0"
     role="dialog"
     aria-modal="true"
     [attr.aria-hidden]="!hamburgerState">

    <!-- Side menu -->
    <div class="sidemenu absolute top-0 right-0 h-full bg-white shadow-2xl
                w-80 sm:w-72 md:w-80 lg:w-96 pt-28"
         [ngClass]="{
           'translate-x-0': hamburgerState,
           'translate-x-full': !hamburgerState
         }"
         (click)="$event.stopPropagation()"
         (keydown)="$event.stopPropagation()"
         role="navigation"
         aria-label="Main navigation">

        <!-- Navigation items -->
        <nav class="px-6 md:px-8 lg:px-12">
            <ul class="space-y-6 md:space-y-8 list-none">
                <li class="text-right">
                    <a routerLink="/about"
                       (click)="toggleHamburger()"
                       class="block text-gray-700 hover:text-primary-yellow
                              text-4xl md:text-5xl lg:text-6xl font-lato font-light
                              py-2 hover:translate-x-[-8px] transform
                              transition-all duration-200">
                        About Me
                    </a>
                </li>
                <li class="text-right">
                    <a routerLink="/works"
                       (click)="toggleHamburger()"
                       class="block text-gray-700 hover:text-primary-yellow
                              text-4xl md:text-5xl lg:text-6xl font-lato font-light
                              py-2 hover:translate-x-[-8px] transform
                              transition-all duration-200">
                        My Works
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Optional: Contact info or social links -->
        <div class="absolute bottom-8 left-6 right-6 md:left-8 md:right-8 lg:left-12 lg:right-12">
            <div class="text-center text-gray-500 text-sm">
                <p class="font-lato">Let's connect</p>
            </div>
        </div>
    </div>
</div>
