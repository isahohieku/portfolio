<!--
  The footer no longer carries the site's only contact route — the landing page
  has a real contact section now — so it returns to being a footer: identity,
  links, and the résumé.

  It also no longer opens with `mt-150 sm:mt-20`, which put a 600px void above
  it on phones and a tidy 5rem on desktops: the exact inversion the `sm:`
  breakpoint misuse produced throughout the old templates.
-->
<footer class="border-t border-subtle bg-surface-minimal">
  <div class="mx-auto w-full max-w-content px-5 py-12 sm:px-8 sm:py-16">
    <div class="flex flex-col gap-10 md:flex-row md:items-start md:justify-between">
      <div class="flex max-w-prose flex-col gap-3">
        <a
          routerLink="/"
          class="text-2xl font-bold uppercase tracking-tight text-heading"
          aria-label="Isah Ohieku — home">
          io
        </a>
        <p class="io-body-md text-muted">
          Software engineer, open to engineering roles and contract work.
        </p>
        <a
          href="mailto:isahohieku@gmail.com"
          class="io-body-md text-brand-text underline decoration-1 underline-offset-4 hover:no-underline">
          isahohieku&#64;gmail.com
        </a>
      </div>

      <div class="flex flex-col gap-6">
        <nav aria-label="Elsewhere">
          <ul class="flex flex-wrap gap-1 pl-0">
            @for (link of socials; track link.label) {
              <li>
                <a
                  [href]="link.href"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="flex h-11 w-11 items-center justify-center rounded-full text-muted transition-colors duration-base ease-io hover:bg-surface-subtle hover:text-heading"
                  [attr.aria-label]="link.label">
                  <i [class]="link.icon" aria-hidden="true"></i>
                </a>
              </li>
            }
          </ul>
        </nav>

        <a
          href="assets/resume.pdf"
          download="Isah Ohieku - Resume.pdf"
          class="inline-flex min-h-[44px] items-center justify-center gap-2 rounded-full border border-moderate px-6 py-3 io-body-sm text-body transition-colors duration-base ease-io hover:border-bold hover:bg-surface-subtle">
          <i class="pi pi-download text-xs" aria-hidden="true"></i>
          Download r&eacute;sum&eacute;
        </a>
      </div>
    </div>

    <p class="mt-10 border-t border-subtle pt-6 io-body-sm text-subtle">
      &copy; {{ year }} Isah Ohieku
    </p>
  </div>
</footer>
