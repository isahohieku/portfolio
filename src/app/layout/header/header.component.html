<header class="flex items-center mt-4 md:mt-12 mx-auto md:px-12 px-5">
    <a class="font-playfair uppercase text-[2.5rem] drop-shadow-[0_5px_3px_rgba(0,0,0,0.35)]" href="/">io</a>

    <button class="ml-auto p-0 h-6 w-8 relative z-50 hambuger-btn"
            [ngClass]="{'fixed right-12 sm:right-5': hamburgerState}"
            (click)="toggleHamburger()">
        <span class="hamburger-menu" [ngClass]="{'hamburger-close': hamburgerState}"></span>
    </button>
</header>

<!-- Side menu overlay -->
<div class="sidemenu-wrapper fixed inset-0 bg-black bg-opacity-10 transition-opacity duration-300 ease-in"
     [ngClass]="{'opacity-100 z-25': hamburgerState, 'opacity-0 -z-50 overflow-hidden': !hamburgerState}">
    <!-- Side menu -->
    <div class="sidemenu absolute top-0 w-75 h-screen bg-white shadow-menu transition-all duration-200 ease-in"
         [ngClass]="{'right-0': hamburgerState, '-right-96': !hamburgerState}">
        <ul class="mt-150 list-none">
            <li class="text-right pr-12 mt-8">
                <a href="/about" class="text-gray-600 text-6xl font-lato">About Me</a>
            </li>
            <li class="text-right pr-12 mt-8">
                <a href="/works" class="text-gray-600 text-6xl font-lato">My Works</a>
            </li>
        </ul>
    </div>
</div>
