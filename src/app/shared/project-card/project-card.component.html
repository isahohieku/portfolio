<!--
  The card root is an anchor, not a div. Previously the only interactive element was
  a link inside the hover-revealed caption, which is unreachable on touch — the whole
  card was a dead end on a phone. As a real link it is tappable, keyboard-focusable,
  crawlable, and supports middle-click / open-in-new-tab.
-->
<a [routerLink]="['/works', project.slug]"
   class="project-wrapper block relative w-full md:w-25rem md:h-25rem bg-project-bg overflow-hidden transition-all duration-500 hover:shadow-2xl hover:scale-[1.03] hover:-translate-y-2 hover:z-50 h-30rem group">
    <!-- Background with subtle inner glow/shadow for contrast -->
    <div class="project-bg h-full absolute top-0 left-0 w-full transition-all duration-500 ease-out"
         [ngStyle]="{'backgroundColor': project.bgColor}">
         <div class="absolute inset-0 bg-gradient-to-tr from-black/10 to-transparent opacity-50"></div>
    </div>

    <!-- Project title -->
    <h3 class="project-title font-lato font-light uppercase absolute left-8 top-12 opacity-0 md:text-xl text-white transition-all duration-500 ease-out group-hover:opacity-100 group-hover:top-8 sm:top-5 sm:text-xs sm:opacity-100 tracking-[0.2em]">
        {{project.title}}
    </h3>

    <!-- Logo, or the project name as a wordmark when no logo asset resolves -->
    <div class="flex justify-center items-center h-full relative z-10 px-12">
        <app-project-logo
            [src]="project.logo"
            [title]="project.title"
            imgClass="h-16 w-auto object-contain transition-all duration-700 ease-out group-hover:scale-110 group-hover:drop-shadow-lg sm:h-10"
            wordmarkClass="font-playfair text-2xl md:text-3xl text-white/90 text-center transition-all duration-700 ease-out group-hover:scale-105" />
    </div>

    <!-- Caption -->
    <div class="project-caption absolute left-0 bottom-0 w-full p-8 text-white translate-y-full transition-all duration-500 ease-out z-20 group-hover:translate-y-0 bg-gradient-to-t from-black/80 to-transparent">
        <p class="font-lato font-light text-sm leading-relaxed">{{project.description}}</p>

        <span class="inline-flex items-center justify-center px-6 py-2 border border-primary-yellow text-primary-yellow text-xs uppercase tracking-widest mt-4 group-hover:bg-primary-yellow group-hover:text-black transition-all duration-300">
            View Details
        </span>
    </div>
</a>
