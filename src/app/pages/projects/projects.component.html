<!-- Page Hero -->
<section class="works-hero bg-dark-bg relative overflow-hidden"
         style="background-image: radial-gradient(circle farthest-corner at 100% -30%, #0e0e0e, rgba(14,14,14,0) 56%)">
  <div class="md:max-w-75rem mx-auto px-5 py-32 md:py-40 relative z-10">
    <div class="flex flex-col gap-4 md:gap-6">
      <!-- Yellow accent bar -->
      <div class="w-16 h-1 bg-primary-yellow mb-2"></div>
      <h1 class="font-normal text-[2.75rem] leading-[1.1] md:text-[clamp(4.5rem,8vw,7.5rem)] lg:text-9xl tracking-tight text-white">
        My Works.
      </h1>
      <p class="font-lato text-gray-custom uppercase tracking-[0.3em] text-sm md:text-lg lg:text-xl font-light opacity-80">
        Selected Projects
      </p>
    </div>
  </div>

  <!-- Decorative geometric accent -->
  <div class="absolute bottom-0 right-0 w-1/3 h-24 bg-primary-yellow opacity-10"></div>
</section>

<!-- Dark interstitial -->
<div class="bg-dark-bg py-12 md:py-16 border-t border-gray-800">
  <div class="md:max-w-75rem mx-auto px-5">
    <p class="font-lato text-center text-gray-custom font-light md:text-lg max-w-2xl mx-auto leading-relaxed">
      A curated collection of projects I've contributed to — from fintech to edtech, greentech to communication platforms.
    </p>
  </div>
</div>

<!-- Projects Grid -->
<div class="md:max-w-75rem mx-auto px-5 py-20 md:py-28">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
    @for (project of projects; track project.id; let i = $index) {
    <!--
      An anchor, not a clickable div. The old div had no href (so no keyboard link
      semantics, no middle-click, no open-in-new-tab, no crawlable URL) and carried a
      nested button firing the same action - two controls for one outcome.
    -->
    <a class="project-card-wrapper block relative w-full h-80 md:h-96 overflow-hidden group"
       [routerLink]="['/works', project.slug]"
       [style.animation-delay]="(i * 100) + 'ms'">
      
      <!-- Color block background -->
      <div class="absolute inset-0 transition-all duration-500 ease-out"
           [ngStyle]="{'backgroundColor': project.bgColor}">
        <div class="absolute inset-0 bg-gradient-to-tr from-black/15 to-transparent opacity-50"></div>
      </div>

      <!-- Project number -->
      <span class="project-number absolute top-6 left-8 font-lato font-light text-white/30 text-7xl md:text-8xl transition-all duration-500 ease-out group-hover:text-white/15 group-hover:scale-110 z-10 select-none">
        0{{project.position}}
      </span>

      <!-- Title overlay (appears on hover from top) -->
      <h2 class="project-title font-lato font-light uppercase absolute left-8 top-14 opacity-0 md:text-xl text-white transition-all duration-500 ease-out group-hover:opacity-100 group-hover:top-8 tracking-[0.2em] z-20">
        {{project.title}}
      </h2>

      <!-- Logo, project screenshot, or the project name as a wordmark - never a broken image -->
      <div class="flex justify-center items-center h-full relative z-10 px-12">
        <app-project-logo
          [src]="project.logo"
          [title]="project.title"
          [showWordmark]="false"
          imgClass="h-14 md:h-16 object-contain transition-all duration-700 ease-out group-hover:scale-110 group-hover:drop-shadow-lg"
          wordmarkClass="font-playfair text-2xl md:text-4xl text-white/90 text-center transition-all duration-700 ease-out group-hover:scale-105" />
      </div>

      <!-- Caption (slides up from bottom on hover) -->
      <div class="project-caption absolute left-0 bottom-0 w-full p-8 text-white translate-y-full transition-all duration-500 ease-out z-20 group-hover:translate-y-0 bg-gradient-to-t from-black/80 to-transparent">
        <p class="font-lato font-light text-sm leading-relaxed mb-4 line-clamp-2">
          {{project.description}}
        </p>

        <div class="flex gap-3">
          <span
            class="inline-flex items-center justify-center px-6 py-2 border border-white text-white text-xs uppercase tracking-widest group-hover:bg-white group-hover:text-black transition-all duration-300">
            View Details
          </span>
        </div>
      </div>
    </a>
    }
  </div>
</div>

<!-- Scroll to Top Button -->
<p-scrolltop />
