<!-- Hero -->
<header class="io-hero-wash">
  <div class="mx-auto flex w-full max-w-content flex-col gap-5 px-5 py-20 sm:px-8 sm:py-28">
    <h1 class="io-display text-heading">Work</h1>
    <p class="io-body-lg max-w-prose text-muted">
      Projects I&rsquo;ve built or contributed to &mdash; fintech, edtech,
      greentech and communications.
    </p>
  </div>
</header>

<!--
  One card component shared with the landing page, so the two grids can no
  longer drift apart. Screenshots stay off this grid and live only inside the
  individual case studies.
-->
<app-section labelledBy="projects-heading">
  <h2 id="projects-heading" class="sr-only">All projects</h2>

  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (project of projects; track project.id; let i = $index) {
      <div class="project-card-wrapper h-full" [style.animation-delay]="i * 80 + 'ms'">
        <app-project-card [project]="project" />
      </div>
    }
  </div>
</app-section>

<p-scrolltop />
