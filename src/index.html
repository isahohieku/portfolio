  <!-- Resolve the theme before first paint so the page never flashes the
       wrong mode. ThemeService adopts whatever this leaves on the element. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('io-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { /* keep the dark default */ }
    })();
  </script>
