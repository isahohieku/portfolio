# Declared here so the deploy does not depend on settings left in the Netlify
# UI from the 2023 build: the application builder emits into browser/, and
# Angular 20 does not run on the Node that site was created with.
[build]
  command = "npm run build"
  publish = "dist/portfolio/browser"

[build.environment]
  NODE_VERSION = "22"

# The app's real routes are served the SPA shell with a 200. Everything else
# gets the same shell with a 404, so a mistyped URL renders the app's own
# not-found page without telling a crawler it is a real page. Files that exist
# (assets, the résumé, sitemap.xml) are served before any of these rules,
# because none of them sets force.
#
# Keep this list in step with src/app/app.routes.ts and app.js.

[[redirects]]
  from = "/projects"
  to = "/works"
  status = 301

# Archived projects. Their pages were public and in the sitemap, so they may
# be indexed; without these, /works/* below served the not-found page with a
# 200. Each is listed by slug and by numeric id, since the route accepts both.
# These must stay above /works/*: the first matching rule wins.

[[redirects]]
  from = "/works/talk360-payment-platform"
  to = "/works/talk360-shared-commerce-foundation"
  status = 301

[[redirects]]
  from = "/works/9616"
  to = "/works/talk360-shared-commerce-foundation"
  status = 301

[[redirects]]
  from = "/works/desrio"
  to = "/works"
  status = 301

[[redirects]]
  from = "/works/9618"
  to = "/works"
  status = 301

[[redirects]]
  from = "/works/sapphital"
  to = "/works"
  status = 301

[[redirects]]
  from = "/works/9620"
  to = "/works"
  status = 301

[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/works"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/works/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
