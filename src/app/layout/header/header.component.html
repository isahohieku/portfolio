<a
  class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-[60] focus:rounded-full focus:bg-brand focus:px-5 focus:py-3 focus:text-on-brand"
  href="#main">
  Skip to content
</a>

<header
  class="border-b border-subtle bg-surface-translucent backdrop-blur-md">
  <div class="mx-auto flex h-16 w-full max-w-content items-center gap-2 px-5 sm:h-[4.5rem] sm:gap-4 sm:px-8">
    <!-- The IO monogram is the one fixed piece of the brand. -->
    <a
      routerLink="/"
      class="-ml-2 inline-flex h-11 min-w-11 items-center justify-center px-2 text-2xl font-bold uppercase tracking-tight text-heading"
      aria-label="Isah Ohieku, home">
      io
    </a>

    <nav class="ml-auto hidden items-center gap-1 md:flex" aria-label="Main">
      <a
        routerLink="/about"
        routerLinkActive="text-heading bg-surface-minimal"
        class="inline-flex min-h-11 items-center rounded-full px-4 io-body-sm text-muted transition-colors duration-base ease-io hover:bg-surface-minimal hover:text-heading">
        Experience
      </a>
      <a
        routerLink="/works"
        routerLinkActive="text-heading bg-surface-minimal"
        class="inline-flex min-h-11 items-center rounded-full px-4 io-body-sm text-muted transition-colors duration-base ease-io hover:bg-surface-minimal hover:text-heading">
        Work
      </a>
      <!-- Same label and destination as the mobile menu: the contact section,
           which holds the address, a copy fallback and the reply facts. -->
      <a
        routerLink="/"
        fragment="contact"
        class="inline-flex min-h-11 items-center rounded-full px-4 io-body-sm text-muted transition-colors duration-base ease-io hover:bg-surface-minimal hover:text-heading">
        Contact
      </a>
    </nav>

    <!-- The résumé lives here rather than in the hero, so it is one tap away
         on every page and at every scroll position, phones included. -->
    <a
      href="/Isah%20Ohieku%20-%20Resume.pdf"
      download="Isah Ohieku - Resume.pdf"
      class="ml-auto inline-flex h-11 items-center gap-2 rounded-full border border-moderate px-4 io-body-sm text-body transition-colors duration-base ease-io hover:border-bold hover:bg-surface-minimal md:ml-3">
      <app-icon name="download" class="text-xs" />
      R&eacute;sum&eacute;<span class="sr-only"> (PDF download)</span>
    </a>

    <button
      type="button"
      class="flex h-11 w-11 items-center justify-center rounded-full text-muted transition-colors duration-base ease-io hover:bg-surface-minimal hover:text-heading"
      (click)="toggleTheme()"
      [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'">
      <app-icon [name]="isDark() ? 'sun' : 'moon'" />
    </button>

    <button
      #menuButton
      type="button"
      class="flex h-11 w-11 items-center justify-center rounded-full text-muted transition-colors duration-base ease-io hover:bg-surface-minimal hover:text-heading md:hidden"
      (click)="menuOpen() ? closeMenu() : openMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      aria-label="Menu">
      <app-icon [name]="menuOpen() ? 'times' : 'bars'" />
    </button>
  </div>
</header>

<!-- Mobile menu. Rendered only when open, so nothing behind it is reachable
     by tab or read by a screen reader while it is closed. -->
@if (menuOpen()) {
  <div
    class="fixed inset-0 z-50 bg-black/60 md:hidden"
    (click)="closeMenu()"
    aria-hidden="true"></div>

  <div
    #panel
    id="mobile-menu"
    class="fixed inset-y-0 right-0 z-50 flex w-[min(20rem,85vw)] flex-col gap-2 border-l border-subtle bg-surface p-6 shadow-overlay md:hidden"
    role="dialog"
    aria-modal="true"
    aria-label="Main navigation"
    (keydown)="onPanelKeydown($event)">
    <div class="flex items-center justify-end">
      <button
        type="button"
        class="flex h-11 w-11 items-center justify-center rounded-full text-muted transition-colors duration-base ease-io hover:bg-surface-minimal hover:text-heading"
        (click)="closeMenu()"
        aria-label="Close menu">
        <app-icon name="times" />
      </button>
    </div>

    <nav class="flex flex-col gap-1" aria-label="Main">
      <a
        routerLink="/about"
        (click)="closeMenu()"
        class="rounded-medium px-4 py-4 io-heading-sm text-heading transition-colors duration-base ease-io hover:bg-surface-minimal">
        Experience
      </a>
      <a
        routerLink="/works"
        (click)="closeMenu()"
        class="rounded-medium px-4 py-4 io-heading-sm text-heading transition-colors duration-base ease-io hover:bg-surface-minimal">
        Work
      </a>
      <a
        routerLink="/"
        fragment="contact"
        (click)="closeMenu()"
        class="rounded-medium px-4 py-4 io-heading-sm text-heading transition-colors duration-base ease-io hover:bg-surface-minimal">
        Contact
      </a>
    </nav>
  </div>
}
